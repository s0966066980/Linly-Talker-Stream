<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Linly-Talker-Stream 數字人展示端">
<title>數字人舞台 · Linly-Talker-Stream</title>
<style>
  :root{
    --bg:#08090c;
    --stage-shadow: 0 40px 120px -20px rgba(0,0,0,.9);
    --ink:#f4f6fa;
    --ink-dim:rgba(244,246,250,.55);
    --idle:#8fa3bf;
    --hear:#3ddc97;
    --think:#f2b544;
    --speak:#7c9cff;
    --halt:#6b7280;
    --bad:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",Segoe UI,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* 深色場地 + 極淡徑向光暈，把視線收斂到中央舞台 */
  .room{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 60% 55% at 50% 42%, rgba(124,156,255,.10), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(61,220,151,.05), transparent 70%);
  }

  /* 9:16 舞台：高度吃滿可用空間，寬度由比例決定 */
  .stage{
    position:relative;
    height:min(100vh - 32px, 100vh);
    aspect-ratio:9/16;
    max-width:calc(100vw - 32px);
    border-radius:20px;
    overflow:hidden;
    background:#000;
    box-shadow:var(--stage-shadow);
    isolation:isolate;
  }
  .stage video{
    width:100%; height:100%;
    object-fit:cover;      /* 各角色原始比例不一，統一裁切成 9:16 */
    display:block;
    background:#000;
  }
  /* 下緣壓一層漸層，讓字幕永遠讀得到 */
  .stage::after{
    content:""; position:absolute; inset:auto 0 0 0; height:42%;
    background:linear-gradient(to top, rgba(4,5,8,.92) 0%, rgba(4,5,8,.55) 40%, transparent 100%);
    pointer-events:none; z-index:1;
  }

  /* ── 中央收音按鈕 ─────────────────────────── */
  .mic-wrap{
    /* 臉部框底端在畫面 49.2%、嘴巴約 43.8%，按鈕中心壓到 62% 才不會擋住對嘴 */
    position:absolute; top:62%; left:50%;
    transform:translate(-50%,-50%);
    z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .mic{
    position:relative;
    width:104px; height:104px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,.30);
    background:rgba(12,15,22,.62);
    color:var(--ink);
    cursor:pointer;
    display:grid; place-items:center;
    transition:transform .18s cubic-bezier(.2,.8,.3,1), background .25s, border-color .25s, opacity .25s;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  .mic:disabled{opacity:.35; cursor:not-allowed}
  .mic:active:not(:disabled){transform:scale(.94)}
  .mic svg{width:38px;height:38px;fill:currentColor;pointer-events:none}

  /* 呼吸光環：顏色就是狀態語言，不用文字狀態列 */
  .ring{
    position:absolute; inset:-14px;
    border-radius:50%;
    border:2px solid var(--ring, var(--idle));
    opacity:.5;
    pointer-events:none;
    will-change:transform,opacity;
    animation:breathe var(--ring-speed,3.4s) ease-in-out infinite;
  }
  .ring.b{inset:-26px; opacity:.22; animation-delay:-1.1s}
  @keyframes breathe{
    0%,100%{transform:scale(.94); opacity:.18}
    50%    {transform:scale(1.06); opacity:.55}
  }
  .mic-hint{
    font-size:12.5px; letter-spacing:.06em;
    color:rgba(255,255,255,.78);
    background:rgba(8,10,14,.68);
    padding:5px 12px; border-radius:999px;
    white-space:nowrap;
    transition:opacity .25s;
  }

  /* 狀態配色 */
  .stage[data-voice="idle"]      .mic-wrap{--ring:var(--idle)}
  .stage[data-voice="hearing"]   .mic-wrap{--ring:var(--hear); --ring-speed:1.2s}
  .stage[data-voice="thinking"]  .mic-wrap{--ring:var(--think); --ring-speed:1.8s}
  .stage[data-voice="speaking"]  .mic-wrap{--ring:var(--speak); --ring-speed:2.2s}
  .stage[data-voice="paused"]    .mic-wrap{--ring:var(--halt); --ring-speed:5s}
  .stage[data-voice="hearing"] .mic{background:rgba(61,220,151,.16); border-color:rgba(61,220,151,.5)}
  .stage[data-voice="speaking"] .mic{opacity:.42}
  .stage[data-voice="speaking"] .mic:hover{opacity:1}

  /* ── 字幕（正中間下方）───────────────────── */
  .captions{
    position:absolute; left:0; right:0; bottom:0;
    z-index:2;
    padding:0 28px 34px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    pointer-events:none; text-align:center;
  }
  .said{
    font-size:13px; line-height:1.5;
    color:var(--ink-dim);
    max-width:100%;
    opacity:0; transform:translateY(6px);
    transition:opacity .3s, transform .3s;
  }
  .said.on{opacity:1; transform:none}
  .said::before{content:"「"} .said::after{content:"」"}
  .reply{
    font-size:clamp(17px, 2.4vh, 23px);
    line-height:1.62;
    font-weight:500;
    letter-spacing:.01em;
    text-shadow:0 2px 18px rgba(0,0,0,.85);
    max-height:20vh; overflow-y:auto;   /* 再高就會頂到 62% 的按鈕 */
    opacity:0; transform:translateY(8px);
    transition:opacity .35s, transform .35s;
    scrollbar-width:none;
  }
  .reply::-webkit-scrollbar{display:none}
  .reply.on{opacity:1; transform:none}

  /* ── 模式徽章 ─────────────────────────────── */
  .mode{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    z-index:3;
    font-size:11.5px; letter-spacing:.1em;
    padding:6px 14px; border-radius:999px;
    background:rgba(8,10,14,.66);
    border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.7);
    display:flex; align-items:center; gap:7px;
    white-space:nowrap;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ring,var(--idle));
       box-shadow:0 0 10px var(--ring,var(--idle))}

  /* ── 覆蓋層（開場 / 錯誤）────────────────── */
  .veil{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:32px; text-align:center;
    background:rgba(6,7,10,.9);
    backdrop-filter:blur(8px);
  }
  .veil[hidden]{display:none}
  .veil h1{font-size:20px; font-weight:600; letter-spacing:.02em}
  .veil p{font-size:13.5px; line-height:1.7; color:var(--ink-dim); max-width:30ch}
  .veil .err{color:var(--bad)}
  .btn{
    appearance:none; border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.07); color:var(--ink);
    padding:11px 26px; border-radius:999px;
    font-size:14px; font-family:inherit; cursor:pointer;
    transition:background .2s, transform .15s;
  }
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{border-color:rgba(255,255,255,.12); background:transparent; color:var(--ink-dim); font-size:12.5px; padding:8px 18px}

  .spinner{
    width:26px;height:26px;border-radius:50%;
    border:2px solid rgba(255,255,255,.16);
    border-top-color:rgba(255,255,255,.75);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:520px){
    .stage{border-radius:0; height:100vh; max-width:100vw}
    .mic{width:88px;height:88px}
  }
  @media (prefers-reduced-motion:reduce){
    .ring{animation:none; opacity:.4}
    .spinner{animation-duration:2s}
  }
</style>
</head>
<body>
<div class="room">
  <main class="stage" id="stage" data-voice="idle">
    <video id="video" autoplay playsinline></video>

    <div class="mode" id="mode"><span class="dot"></span><span id="modeText">連線中</span></div>

    <div class="mic-wrap">
      <button class="mic" id="mic" disabled aria-label="收音">
        <span class="ring"></span><span class="ring b"></span>
        <svg id="micIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Z"/>
          <path d="M18.5 11.5a.9.9 0 0 0-1.8 0 4.7 4.7 0 0 1-9.4 0 .9.9 0 0 0-1.8 0 6.5 6.5 0 0 0 5.6 6.43V21h-2.2a.9.9 0 0 0 0 1.8h6.2a.9.9 0 0 0 0-1.8h-2.2v-3.07a6.5 6.5 0 0 0 5.6-6.43Z"/>
        </svg>
      </button>
      <div class="mic-hint" id="hint">準備中</div>
    </div>

    <div class="captions">
      <div class="said" id="said"></div>
      <div class="reply" id="reply"></div>
    </div>

    <div class="veil" id="veil">
      <h1 id="veilTitle">數字人舞台</h1>
      <p id="veilText">點擊進入，瀏覽器會詢問麥克風權限。</p>
      <button class="btn" id="veilBtn">進入</button>
      <button class="btn ghost" id="veilAlt" hidden>開啟控制台</button>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const stage=$('stage'), video=$('video'), mic=$('mic'), hint=$('hint');
  const said=$('said'), reply=$('reply'), modeText=$('modeText');
  const veil=$('veil'), veilTitle=$('veilTitle'), veilText=$('veilText'),
        veilBtn=$('veilBtn'), veilAlt=$('veilAlt');

  // ── 連線狀態 ────────────────────────────────
  let pc=null, chan=null, micStream=null;
  let sessionId=0, lastSeq=0;
  let autoMode=false;        // 後台 VAD 開啟 → 自動收音
  let autoPaused=false;      // 自動模式下使用者主動暫停收音
  let holding=false;         // 按鍵收音進行中
  let speaking=false;        // 數字人正在說話
  let live=false;
  let replyTimer=null, saidTimer=null;

  // ── 舞台狀態 ────────────────────────────────
  // 後端 12 種 state 壓成 4 種視覺語言，異常態走覆蓋層
  const VISUAL = {
    listening:'idle', preparing:'idle',
    speech_detected:'hearing',
    stt:'thinking', llm:'thinking', tts_ready:'thinking',
    avatar_speaking:'speaking', tail_guard:'speaking',
    paused:'paused'
  };

  function setVisual(v){ stage.dataset.voice = v; }

  function refreshAffordance(){
    if(!live){ mic.disabled=true; hint.textContent='準備中'; return; }
    mic.disabled=false;
    if(speaking){ hint.textContent = autoMode ? '點一下插話' : '點一下插話'; return; }
    if(autoMode){ hint.textContent = autoPaused ? '已暫停收音，點一下恢復' : '直接說話'; return; }
    hint.textContent = holding ? '放開送出' : '按住說話';
  }

  function setMode(){
    modeText.textContent = !live ? '連線中'
      : autoMode ? (autoPaused ? '自動收音・已暫停' : '自動收音')
      : '按鍵收音';
  }

  function showReply(text){
    clearTimeout(replyTimer);
    reply.textContent = text;
    reply.classList.add('on');
    reply.scrollTop = 0;
  }
  function fadeReply(){
    clearTimeout(replyTimer);
    replyTimer = setTimeout(() => reply.classList.remove('on'), 3000);
  }
  function showSaid(text){
    clearTimeout(saidTimer);
    said.textContent = text;
    said.classList.add('on');
    saidTimer = setTimeout(() => said.classList.remove('on'), 4500);
  }

  function showVeil(title, text, {isError=false, btn='重試', onBtn=null, alt=false}={}){
    veilTitle.textContent = title;
    veilText.textContent = text;
    veilText.classList.toggle('err', isError);
    veilBtn.textContent = btn;
    veilBtn.hidden = !onBtn;
    veilBtn.onclick = onBtn;
    veilAlt.hidden = !alt;
    veil.hidden = false;
  }
  const hideVeil = () => { veil.hidden = true; };

  veilAlt.onclick = () => { window.location.href = '/'; };

  // ── 控制訊息 ────────────────────────────────
  function send(msg){
    if(!chan || chan.readyState !== 'open') return false;
    chan.send(JSON.stringify(msg));
    return true;
  }
  function setCapture(enabled, finalize=false){
    micStream?.getAudioTracks().forEach(t => { t.enabled = Boolean(enabled); });
    return send({type:'capture', enabled:Boolean(enabled), finalize});
  }
  function interrupt(){
    micStream?.getAudioTracks().forEach(t => { t.enabled = true; });
    return send({type:'interrupt'});
  }

  // ── 收音模式：跟著後台 VAD 開關走 ────────────
  async function syncVadMode(){
    try{
      const r = await fetch('/api/vad', {cache:'no-store'});
      if(!r.ok) return;
      const payload = await r.json();
      const next = Boolean(payload?.data?.enabled);
      if(next === autoMode) return;
      autoMode = next;
      autoPaused = false;
      holding = false;
      if(live) setCapture(autoMode && !speaking);
      setMode(); refreshAffordance();
    }catch(_){ /* 後台不可達時維持現有模式 */ }
  }

  // ── 會話事件 ────────────────────────────────
  function onVoiceEvent(ev){
    if(ev.type === 'state'){
      if(ev.state === 'error' || ev.state === 'degraded'){
        if(ev.error) showReply(String(ev.error));
        fadeReply();
      }
      const v = VISUAL[ev.state];
      if(v) setVisual(v);
      if(ev.state === 'listening'){ speaking = false; }
      refreshAffordance();
      return;
    }
    if(ev.type === 'user_transcript' && ev.text){ showSaid(ev.text); return; }
    if(ev.type === 'assistant_text' && ev.text){ showReply(ev.text); return; }
    if(ev.type === 'speaking_start'){
      clearTimeout(replyTimer);
      if(reply.textContent) reply.classList.add('on');
      speaking = true; setVisual('speaking'); refreshAffordance(); return;
    }
    if(ev.type === 'speaking_end'){
      speaking = false; fadeReply();
      setVisual(autoMode && !autoPaused ? 'idle' : 'paused');
      refreshAffordance(); return;
    }
    if(ev.type === 'turn_cancelled'){
      speaking = false; fadeReply(); refreshAffordance();
    }
  }

  // ── 建立 WebRTC 連線 ────────────────────────
  async function connect(){
    teardown();
    showVeil('連線中', '正在建立與數字人的即時通道。', {btn:'', onBtn:null});
    veilBtn.hidden = true;

    pc = new RTCPeerConnection({iceServers:[]});

    const remote = new MediaStream();
    // 只綁一次 srcObject。音軌與視訊軌是分開抵達的，每次 ontrack 都重綁會讓
    // 元素重新接管已在播放的音訊管線，兩軌可能因此跑在各自的時鐘上。
    video.srcObject = remote;
    pc.ontrack = (e) => {
      if(!remote.getTracks().some(t => t.id === e.track.id)) remote.addTrack(e.track);
    };
    pc.onconnectionstatechange = () => {
      const s = pc?.connectionState;
      if(s === 'connected'){ live = true; hideVeil(); setMode(); refreshAffordance(); }
      if(s === 'failed' || s === 'disconnected'){
        live = false; refreshAffordance();
        showVeil('連線中斷', '與數字人的通道已斷開。', {isError:true, btn:'重新連線', onBtn:connect});
      }
    };

    chan = pc.createDataChannel('voice-events', {ordered:true});
    chan.onopen = () => setCapture(autoMode && Boolean(micStream));
    chan.onmessage = (e) => {
      try{
        const msg = JSON.parse(e.data);
        if(!Number.isFinite(msg.seq) || msg.seq <= lastSeq) return;
        lastSeq = msg.seq;
        onVoiceEvent(msg);
      }catch(_){ /* 壞掉的事件直接丟掉 */ }
    };

    // 麥克風拿不到也要能看數字人，退成純觀看
    try{
      micStream = await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1}
      });
      pc.addTrack(micStream.getAudioTracks()[0], micStream);
      micStream.getAudioTracks()[0].enabled = false;
    }catch(err){
      micStream = null;
      pc.addTransceiver('audio', {direction:'recvonly'});
      showSaid('麥克風無法使用，目前為純觀看');
    }
    pc.addTransceiver('video', {direction:'recvonly'});

    try{
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      const res = await fetch('/offer', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          client_role:'stage',
          sdp:pc.localDescription.sdp,
          type:pc.localDescription.type
        })
      });
      if(!res.ok){
        let m = `HTTP ${res.status}`;
        try{ m = (await res.json()).msg || m; }catch(_){}
        if(res.status === 409){
          teardown();
          showVeil('數字人尚未就緒', m, {btn:'重試', onBtn:connect, alt:true});
          return;
        }
        throw new Error(m);
      }
      const data = await res.json();
      sessionId = data.sessionid;
      await pc.setRemoteDescription(new RTCSessionDescription({sdp:data.sdp, type:data.type}));
    }catch(err){
      teardown();
      showVeil('無法連線', String(err.message || err), {isError:true, btn:'重試', onBtn:connect});
    }
  }

  function teardown(){
    live = false; speaking = false; holding = false; lastSeq = 0;
    if(chan){ chan.onclose=null; chan.onerror=null; try{chan.close();}catch(_){} }
    chan = null;
    if(pc){ try{pc.close();}catch(_){} }
    pc = null;
    micStream?.getTracks().forEach(t => t.stop());
    micStream = null;
    video.srcObject = null;
    setVisual('idle');
    refreshAffordance();
  }

  // ── 中央按鈕：按鍵收音 / 自動模式開關 / 插話 ──
  mic.addEventListener('pointerdown', (e) => {
    if(mic.disabled) return;
    e.preventDefault();
    if(speaking){ interrupt(); return; }
    if(autoMode) return;                 // 自動模式在 pointerup 才切換
    holding = true;
    setCapture(true);
    setVisual('hearing');
    refreshAffordance();
  });

  const release = () => {
    if(!holding) return;
    holding = false;
    setCapture(false, true);             // finalize：把這段發話收尾送去 STT
    setVisual('thinking');
    refreshAffordance();
  };
  mic.addEventListener('pointerup', (e) => {
    if(mic.disabled) return;
    e.preventDefault();
    if(autoMode && !speaking){
      autoPaused = !autoPaused;
      setCapture(!autoPaused);
      setVisual(autoPaused ? 'paused' : 'idle');
      setMode(); refreshAffordance();
      return;
    }
    release();
  });
  mic.addEventListener('pointercancel', release);
  mic.addEventListener('pointerleave', release);

  // 空白鍵 = 同一顆按鈕
  addEventListener('keydown', (e) => {
    if(e.code !== 'Space' || e.repeat || mic.disabled) return;
    e.preventDefault();
    mic.dispatchEvent(new PointerEvent('pointerdown', {bubbles:true}));
  });
  addEventListener('keyup', (e) => {
    if(e.code !== 'Space' || mic.disabled) return;
    e.preventDefault();
    mic.dispatchEvent(new PointerEvent('pointerup', {bubbles:true}));
  });

  // ── 開場：需要一次使用者手勢才能自動播放帶聲音的影片 ──
  veilBtn.onclick = async () => {
    veilBtn.hidden = true;
    await syncVadMode();
    await connect();
    try{ await video.play(); }catch(_){}
  };

  addEventListener('beforeunload', teardown);

  // 後台改 VAD 開關後，這裡最多 5 秒跟上
  setInterval(syncVadMode, 5000);
  setMode();
})();
</script>
</body>
</html>
