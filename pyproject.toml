[project]
name = "linly-talker-stream"
version = "0.1.0"
description = "Linly-Talker-Stream: 即時流式數字人對話系統 - 模組化多 Avatar 支援，基於 WebRTC 的全雙工互動"
readme = "README.md"
requires-python = ">=3.10, <3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kedreamix", email = "kedreamix@gmail.com" }
]

dependencies = [
    "aiohttp",
    "aiohttp-cors",
    "aiortc",
    "av",
    "edge-tts",
    "faster-whisper>=1.1",
    "onnxruntime>=1.16,<1.24",
    "librosa",
    "omegaconf",
    "openai",
    "numpy<2",
    "opencv-python-headless<4.12",
    "pydantic",
    "PyYAML",
    "scipy",
    "soundfile==0.12.1",
    "torch==2.5.0",
    "torchvision",
    "torchaudio",
    "tqdm",
    "typing-extensions",
    "websockets==12.0",
    "resampy",
    "logger",
    # mmengine/mmpose still import pkg_resources; setuptools>=82 removed it.
    "setuptools==69.5.1",
    "transformers==4.46.0",
]

# 服務端 VAD 依賴（按需安裝：uv pip install -e ".[vad]"）
[project.optional-dependencies]
vad = [
    "silero-vad>=5.1",           # Silero VAD，pip 包自帶模型，可離線使用
]
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]
torchvision = [
    { index = "pytorch-cu124" },
]
torchaudio = [
    { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"
